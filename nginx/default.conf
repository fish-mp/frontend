server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Preserve old policy links and switch text through the shared legal page.
    location = /fishkids_politika_konfidencialnosti.pdf {
        absolute_redirect off;
        return 302 /legal/privacy-policy;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: health check
    location = /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
