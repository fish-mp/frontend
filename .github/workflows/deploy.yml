name: Deploy
on:
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect frontend deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          port: ${{ secrets.PROD_SSH_PORT }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            id
            docker inspect deploy_frontend_1 --format 'Image={{.Config.Image}} WorkDir={{.Config.WorkingDir}} Cmd={{json .Config.Cmd}} Mounts={{json .Mounts}}'
            docker exec deploy_frontend_1 sh -c 'ls -la /usr/share/nginx/html; cat /etc/nginx/conf.d/default.conf'
            cat /home/desai/frontend/Dockerfile
            cat /home/desai/deploy/deploy.sh
            git -C /home/desai/frontend status --short
