name: Frontend CI
on:
  push:
    branches: [ main ]  # замените на нужную ветку
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: bash -n scripts/deploy-aquarium.sh
      - run: npm run test:aquarium
      - run: npm run test:auth
      - run: npm run build
